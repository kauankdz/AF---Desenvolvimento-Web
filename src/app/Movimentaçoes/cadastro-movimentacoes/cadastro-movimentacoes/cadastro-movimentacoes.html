<div class="p-4 max-w-md mx-auto">

    <div class="mb-6 border-b pb-2">
        <h2 class="text-xl font-bold">Nova Movimentação</h2>

    </div>

    @if (erro) {
    <div class="text-red-600 font-bold mb-4 border border-red-600 p-2 bg-red-50">
        Erro: {{ erro }}
    </div>
    }

    <form (ngSubmit)="salvarMovimentacao()">

        <div class="mb-4">
            <label class="block font-bold mb-1">Descrição:</label>
            <input type="text" [(ngModel)]="descricao" name="descricao"
                class="w-full border border-gray-400 p-2 rounded" placeholder="Ex: Compra no supermercado">
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-1">Valor (R$):</label>
            <input type="number" [(ngModel)]="valor" name="valor" class="w-full border border-gray-400 p-2 rounded"
                placeholder="0.00">
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-1">Categoria:</label>
            <select [(ngModel)]="categoriaId" name="categoriaId" [disabled]="carregando"
                class="w-full border border-gray-400 p-2 rounded bg-white">

                <option [ngValue]="null" disabled selected>-- Selecione --</option>

                @for (cat of categorias; track cat._id) {
                <option [ngValue]="cat._id">{{ cat.nome }}</option>
                }
            </select>
            @if (categorias.length === 0) { <small>Sem categorias carregadas.</small> }
        </div>

        <div class="mb-6">
            <label class="block font-bold mb-1">Tipo:</label>
            <select [(ngModel)]="Tipo" name="tipo" class="w-full border border-gray-400 p-2 rounded bg-white">
                <option [ngValue]="null" disabled selected>-- Selecione --</option>
                <option value="ENTRADA">Entrada</option>
                <option value="SAIDA">Saída</option>
            </select>
        </div>

        <button type="submit" [disabled]="salvando"
            class="w-full bg-green-600 text-white font-bold p-3 rounded hover:bg-green-700 disabled:bg-gray-400">
            @if (salvando) { Salvando... } @else { Salvar }
        </button>

    </form>
</div>
